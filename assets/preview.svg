<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001420" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#00050a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="ringPulse" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="95%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redRingPulse" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#ff3b30" stop-opacity="0"/>
      <stop offset="95%" stop-color="#ff3b30" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="redArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3b30" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3b30" stop-opacity="0.9"/>
    </linearGradient>
    <style>
      .mono { font-family: 'Courier New', monospace; }
      .hairline { stroke: rgba(255,255,255,0.12); stroke-width: 1; fill: none; }
      .graticule { stroke: rgba(255,255,255,0.08); stroke-width: 0.8; fill: none; }
      .continent { stroke: rgba(255,255,255,0.32); stroke-width: 1.2; fill: none; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Absolute Black Void Background -->
  <rect width="1200" height="680" fill="#000000" />

  <!-- Top Minimalist Avionics Header -->
  <rect x="0" y="0" width="1200" height="42" fill="#000000" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  
  <circle cx="28" cy="21" r="3.5" fill="#00ff66" />
  <text x="42" y="25" fill="#ffffff" class="mono" font-size="12" font-weight="bold" letter-spacing="1.5">VECTOR // 01</text>
  <text x="145" y="25" fill="#52525b" class="mono" font-size="11">/ GLOBAL THREAT TELEMETRY</text>

  <text x="560" y="25" fill="#71717a" class="mono" font-size="11">PEAK <tspan fill="#ffffff" font-weight="bold">342.1</tspan> GBPS</text>
  <text x="700" y="25" fill="#71717a" class="mono" font-size="11">RATE <tspan fill="#ffffff" font-weight="bold">8.4</tspan> EVT/S</text>
  <text x="830" y="25" fill="#71717a" class="mono" font-size="11">INTERCEPT <tspan fill="#ffffff" font-weight="bold">67,322</tspan></text>
  <text x="1000" y="25" fill="#52525b" class="mono" font-size="10">REF: 37°46'N / 122°25'W</text>

  <!-- Central 3D Vector Wireframe Globe -->
  <g transform="translate(600, 350)">
    <!-- Sphere Body -->
    <circle cx="0" cy="0" r="230" fill="url(#globeGlow)" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="232" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15" />

    <!-- Celestial Graticule Latitude Parallels -->
    <ellipse cx="0" cy="-160" rx="160" ry="24" class="graticule" />
    <ellipse cx="0" cy="-110" rx="200" ry="32" class="graticule" />
    <ellipse cx="0" cy="-55" rx="222" ry="38" class="graticule" />
    <ellipse cx="0" cy="0" rx="230" ry="40" class="graticule" stroke="rgba(255,255,255,0.15)" />
    <ellipse cx="0" cy="55" rx="222" ry="38" class="graticule" />
    <ellipse cx="0" cy="110" rx="200" ry="32" class="graticule" />
    <ellipse cx="0" cy="160" rx="160" ry="24" class="graticule" />

    <!-- Celestial Graticule Longitude Meridians -->
    <ellipse cx="0" cy="0" rx="45" ry="230" class="graticule" />
    <ellipse cx="0" cy="0" rx="110" ry="230" class="graticule" />
    <ellipse cx="0" cy="0" rx="175" ry="230" class="graticule" />
    <line x1="0" y1="-230" x2="0" y2="230" class="graticule" stroke="rgba(255,255,255,0.18)" />

    <!-- Stylized Hollow Vector Continental Outlines -->
    <!-- North America -->
    <path d="M-190,-90 L-160,-125 L-120,-140 L-95,-130 L-85,-95 L-100,-70 L-130,-40 L-150,-10 L-165,-25 L-155,-50 L-185,-65 Z" class="continent" />
    <!-- South America -->
    <path d="M-130,-5 L-105,-15 L-90,20 L-80,60 L-95,110 L-115,135 L-125,90 L-140,30 Z" class="continent" />
    <!-- Europe & Africa -->
    <path d="M-20,-110 L15,-130 L45,-105 L25,-85 L-10,-90 Z" class="continent" />
    <path d="M-25,-75 L20,-75 L40,-40 L45,15 L25,80 L-5,85 L-30,20 L-25,-35 Z" class="continent" />
    <!-- Asia -->
    <path d="M50,-115 L95,-130 L160,-115 L190,-85 L180,-40 L140,-25 L115,-45 L85,-60 L50,-85 Z" class="continent" />
    <!-- Australia -->
    <path d="M125,45 L170,40 L180,75 L155,100 L125,85 Z" class="continent" />

    <!-- High-Impact Trajectory Arcs -->
    <!-- Arc 1: East Asia to US East Coast (Razor Red Surge > 100 Gbps) -->
    <path d="M140,-60 Q0,-240 -115,-65" fill="none" stroke="url(#redArc)" stroke-width="2.2" stroke-dasharray="80,10" />
    <circle cx="140" cy="-60" r="3" fill="#ff3b30" />
    <!-- Target Ripple Wave 1 (Large) -->
    <circle cx="-115" cy="-65" r="32" fill="url(#redRingPulse)" stroke="#ff3b30" stroke-width="1.2" opacity="0.85" />
    <circle cx="-115" cy="-65" r="58" fill="none" stroke="#ff3b30" stroke-width="0.8" opacity="0.4" stroke-dasharray="4,4" />

    <!-- Arc 2: Europe to US West (Pure Cyan L4 Transport Flood) -->
    <path d="M10,-95 Q-70,-180 -155,-40" fill="none" stroke="url(#cyanArc)" stroke-width="1.8" stroke-dasharray="60,8" />
    <circle cx="10" cy="-95" r="2.5" fill="#00f0ff" />
    <!-- Target Ripple Wave 2 -->
    <circle cx="-155" cy="-40" r="26" fill="url(#ringPulse)" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <circle cx="-155" cy="-40" r="46" fill="none" stroke="#00f0ff" stroke-width="0.6" opacity="0.45" />

    <!-- Arc 3: Brazil to Central Europe (Pure White L7 Flood) -->
    <path d="M-105,10 Q-30,-120 20,-85" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="45,6" />
    <circle cx="-105" cy="10" r="2.5" fill="#ffffff" />
    <circle cx="20" cy="-85" r="22" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.75" />
  </g>

  <!-- Left Dock: 01 // EVENT_STREAM -->
  <g transform="translate(35, 410)">
    <line x1="0" y1="0" x2="310" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="-10" fill="#ffffff" class="mono" font-size="11" font-weight="bold" letter-spacing="1">01 // EVENT_STREAM</text>
    <text x="240" y="-10" fill="#71717a" class="mono" font-size="10">BUFF: 35/35</text>

    <!-- Event Rows -->
    <text x="0" y="24" fill="#52525b" class="mono" font-size="10">23:58:12</text>
    <text x="65" y="24" fill="#ffffff" class="mono" font-size="11">CN</text>
    <text x="88" y="24" fill="#52525b" class="mono" font-size="10">→</text>
    <text x="105" y="24" fill="#ffffff" class="mono" font-size="11">US</text>
    <text x="135" y="24" fill="#71717a" class="mono" font-size="10">[SYN]</text>
    <text x="250" y="24" fill="#ff3b30" class="mono" font-size="11" font-weight="bold">142.8G</text>
    <line x1="0" y1="32" x2="310" y2="32" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <text x="0" y="48" fill="#52525b" class="mono" font-size="10">23:58:12</text>
    <text x="65" y="48" fill="#ffffff" class="mono" font-size="11">DE</text>
    <text x="88" y="48" fill="#52525b" class="mono" font-size="10">→</text>
    <text x="105" y="48" fill="#ffffff" class="mono" font-size="11">US</text>
    <text x="135" y="48" fill="#71717a" class="mono" font-size="10">[UDP]</text>
    <text x="256" y="48" fill="#00f0ff" class="mono" font-size="11">68.2G</text>
    <line x1="0" y1="56" x2="310" y2="56" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <text x="0" y="72" fill="#52525b" class="mono" font-size="10">23:58:13</text>
    <text x="65" y="72" fill="#ffffff" class="mono" font-size="11">BR</text>
    <text x="88" y="72" fill="#52525b" class="mono" font-size="10">→</text>
    <text x="105" y="72" fill="#ffffff" class="mono" font-size="11">FR</text>
    <text x="135" y="72" fill="#71717a" class="mono" font-size="10">[HTTP]</text>
    <text x="256" y="72" fill="#ffffff" class="mono" font-size="11">24.5G</text>
    <line x1="0" y1="80" x2="310" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <text x="0" y="96" fill="#52525b" class="mono" font-size="10">23:58:13</text>
    <text x="65" y="96" fill="#ffffff" class="mono" font-size="11">RU</text>
    <text x="88" y="96" fill="#52525b" class="mono" font-size="10">→</text>
    <text x="105" y="96" fill="#ffffff" class="mono" font-size="11">JP</text>
    <text x="135" y="96" fill="#71717a" class="mono" font-size="10">[DNS]</text>
    <text x="256" y="96" fill="#00f0ff" class="mono" font-size="11">18.1G</text>
    <line x1="0" y1="104" x2="310" y2="104" stroke="rgba(255,255,255,0.06)" stroke-width="1" />

    <!-- Filter Buttons -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="45" height="18" fill="rgba(255,255,255,0.1)" stroke="#ffffff" stroke-width="1" />
      <text x="12" y="13" fill="#ffffff" class="mono" font-size="9">ALL</text>

      <rect x="52" y="0" width="40" height="18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="64" y="13" fill="#71717a" class="mono" font-size="9">L4</text>

      <rect x="99" y="0" width="40" height="18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="111" y="13" fill="#71717a" class="mono" font-size="9">L7</text>

      <rect x="146" y="0" width="110" height="18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
      <text x="154" y="13" fill="#71717a" class="mono" font-size="9">CRITICAL > 85G</text>
    </g>
  </g>

  <!-- Right Dock: 02 // TARGET_CONCENTRATION -->
  <g transform="translate(860, 420)">
    <line x1="0" y1="0" x2="305" y2="0" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <text x="0" y="-10" fill="#ffffff" class="mono" font-size="11" font-weight="bold" letter-spacing="1">02 // TARGET_CONCENTRATION</text>
    <text x="255" y="-10" fill="#71717a" class="mono" font-size="10">L3/L4/L7</text>

    <!-- Gauge 1: US -->
    <text x="0" y="24" fill="#ffffff" class="mono" font-size="11">US</text>
    <text x="210" y="24" fill="#71717a" class="mono" font-size="10">284 PKTS (42%)</text>
    <rect x="0" y="30" width="305" height="1.5" fill="rgba(255,255,255,0.1)" />
    <rect x="0" y="30" width="128" height="1.5" fill="#ffffff" />

    <!-- Gauge 2: DE -->
    <text x="0" y="52" fill="#ffffff" class="mono" font-size="11">DE</text>
    <text x="215" y="52" fill="#71717a" class="mono" font-size="10">98 PKTS (19%)</text>
    <rect x="0" y="58" width="305" height="1.5" fill="rgba(255,255,255,0.1)" />
    <rect x="0" y="58" width="58" height="1.5" fill="#ffffff" />

    <!-- Gauge 3: JP -->
    <text x="0" y="80" fill="#ffffff" class="mono" font-size="11">JP</text>
    <text x="215" y="80" fill="#71717a" class="mono" font-size="10">72 PKTS (14%)</text>
    <rect x="0" y="86" width="305" height="1.5" fill="rgba(255,255,255,0.1)" />
    <rect x="0" y="86" width="42" height="1.5" fill="#ffffff" />

    <!-- Gauge 4: GB -->
    <text x="0" y="108" fill="#ffffff" class="mono" font-size="11">GB</text>
    <text x="222" y="108" fill="#71717a" class="mono" font-size="10">48 PKTS (9%)</text>
    <rect x="0" y="114" width="305" height="1.5" fill="rgba(255,255,255,0.1)" />
    <rect x="0" y="114" width="28" height="1.5" fill="#ffffff" />
  </g>

  <!-- Bottom Orthographic Spec Footer -->
  <line x1="0" y1="645" x2="1200" y2="645" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <text x="35" y="663" fill="#71717a" class="mono" font-size="10">SCALE: 1:100M  |  PROJECTION: ORTHOGRAPHIC_VECTOR  |  DATA_SOURCE: CLOUDFLARE_RADAR_INTERPOLATED</text>
  <text x="890" y="663" fill="#52525b" class="mono" font-size="10">ORIENTATION: [GLOBAL] [NA] [EMEA] [APAC]</text>
  <text x="1140" y="663" fill="#00ff66" class="mono" font-size="10">FPS: 60</text>
</svg>
