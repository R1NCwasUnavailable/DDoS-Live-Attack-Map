version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ddos-backend
    ports:
      - "8000:8000"
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - POISSON_MIN_RATE=2.5
      - POISSON_MAX_RATE=10.0
      - EXP_VOLUME_MU=25.0
      - VOLUME_FLOOR=1.5
      - GEO_JITTER_RANGE=2.5
      - RADAR_CACHE_TTL_SEC=600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ddos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

